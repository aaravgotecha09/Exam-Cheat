spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
app.reports-dir=target/test-reports
app.cors.allowed-origin-patterns=http://localhost:*
app.session-active-seconds=120
app.max-events-per-minute=5
exam.policy.block-clipboard=true
exam.policy.block-context-menu=true
spring.jackson.default-property-inclusion=non_null
