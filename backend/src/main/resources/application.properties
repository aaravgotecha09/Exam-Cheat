spring.application.name=exam-cheat-detection
# Render injects PORT. Locally it falls back to 8080.
server.port=${PORT:8080}

# ---- H2 file database (stored in ./data). On Render FREE plan the disk is wiped on every restart/redeploy ----
spring.datasource.url=jdbc:h2:file:${DB_PATH:./data/examdb}
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# ---- CORS: the Chrome extension (origin chrome-extension://<id>) and local testing ----
# In Render set CORS_ORIGINS=chrome-extension://YOUR_EXTENSION_ID to lock it to your extension.
app.cors.allowed-origin-patterns=${CORS_ORIGINS:chrome-extension://*,http://localhost:*,http://127.0.0.1:*}

# ---- Reports: one file per completed session (also downloadable from the extension) ----
app.reports-dir=${REPORTS_DIR:reports}

# ---- Session / throttling rules ----
app.session-active-seconds=120
app.max-events-per-minute=60

# ---- Exam policy sent to the extension ----
exam.policy.block-clipboard=true
exam.policy.block-context-menu=true

spring.jackson.default-property-inclusion=non_null
