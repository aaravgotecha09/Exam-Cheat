# Optional Render "Blueprint". You can ignore this file and create the service by hand (see README Part A).
services:
  - type: web
    name: exam-cheat-backend
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: CORS_ORIGINS
        sync: false   # e.g. chrome-extension://YOUR_EXTENSION_ID
